name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply before building
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      draft:
        description: Publish the GitHub release as a draft
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Guard branch
        if: github.ref_type != 'branch'
        run: |
          echo "::error::dispatch this workflow on a branch, not a tag or sha"
          exit 1

      - name: Install cargo-edit
        if: inputs.bump != 'none'
        run: cargo install cargo-edit --locked

      - name: Bump version
        if: inputs.bump != 'none'
        run: cargo set-version --bump ${{ inputs.bump }}

      - name: Resolve version
        id: resolve
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "servo-cli") | .version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; bump the version or delete the tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

      - name: Commit bump
        if: inputs.bump != 'none'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Push tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # The arm runner label only works in public repositories.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/servo-cli-$TAG-$TARGET.tar.gz" \
            -C "target/$TARGET/release" servo-cli

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: servo-cli-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=(--title "$TAG" --generate-notes)
          if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
          gh release create "$TAG" "${args[@]}" dist/*.tar.gz
